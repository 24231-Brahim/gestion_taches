<div class="chat-header">
  @if (showBack()) {
    <button type="button" class="chat-header-back" (click)="back.emit()">
      <fa-icon icon="chevron-left" />
    </button>
  }
  <div class="chat-header-info">
    <div class="chat-header-title">
      @if (isDirect()) {
        <fa-icon icon="user" class="chat-header-icon" />
      } @else {
        <fa-icon icon="comments" class="chat-header-icon" />
      }
      <span>{{ title() }}</span>
    </div>
    <div class="chat-header-meta">
      <span>{{ 'chat.header.membersCount' | translate: { count: members().length } }}</span>
      @if (onlineCount() > 0) {
        <span class="chat-header-online">
          <span class="chat-header-dot"></span>
          {{ 'chat.header.onlineCount' | translate: { count: onlineCount() } }}
        </span>
      }
    </div>
  </div>
</div>
